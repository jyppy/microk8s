      maxOccurrences: 1
  sans:
    dnsNames:
      type: OPTIONAL
      allowedValues:
      - "^.*\\.svc\\.cluster\\.local"
      maxOccurrences: 10
  keyUsages:
  - digitalSignature
  - keyEncipherment
  extendedKeyUsages:
  - CLIENT_AUTH
