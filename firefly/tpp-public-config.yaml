      - Sydney
      maxOccurrences: 1
    stateOrProvince:
      type: OPTIONAL
      allowedValues:
      - ^.*$
      defaultValues:
      - NSW
      maxOccurrences: 1
    country:
      type: OPTIONAL
      allowedValues:
      - ^.*$
      defaultValues:
